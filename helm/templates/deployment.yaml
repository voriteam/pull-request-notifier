apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ include "pull-request-notifier.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pull-request-notifier.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pull-request-notifier.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # One replica, so any eviction is an outage until the new pod is reachable.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- if .Values.litestream.enabled }}
        checksum/litestream: {{ include "pull-request-notifier.litestreamConfig" . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pull-request-notifier.serviceAccountName" . }}
      securityContext:
        fsGroup: 100
      {{- if .Values.litestream.enabled }}
      {{- $litestreamSecurityContext := dict "runAsUser" .Values.litestream.runAsUser "runAsGroup" .Values.litestream.runAsGroup "runAsNonRoot" true "allowPrivilegeEscalation" false }}
      {{- $litestreamMounts := list (dict "name" "data" "mountPath" "/data") (dict "name" "litestream-config" "mountPath" "/etc/litestream" "readOnly" true) }}
      initContainers:
        - name: litestream-restore
          image: {{ .Values.litestream.image | quote }}
          args:
            - restore
            - -config
            - /etc/litestream/litestream.yml
            - -if-db-not-exists
            - -if-replica-exists
            - {{ .Values.config.dbPath | quote }}
          securityContext:
            {{- toYaml $litestreamSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.litestream.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml $litestreamMounts | nindent 12 }}
        - name: litestream
          image: {{ .Values.litestream.image | quote }}
          restartPolicy: Always
          args:
            - replicate
            - -config
            - /etc/litestream/litestream.yml
          securityContext:
            {{- toYaml $litestreamSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.litestream.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml $litestreamMounts | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ include "pull-request-notifier.containerName" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ int .Values.config.port }}
              protocol: TCP
          env:
            {{- if .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ .Values.goMemLimit | quote }}
            {{- end }}
            - name: PORT
              value: {{ .Values.config.port | quote }}
            - name: BASE_URL
              value: {{ .Values.config.baseURL | quote }}
            - name: DB_PATH
              value: {{ .Values.config.dbPath | quote }}
            - name: ENABLE_BOT_COMMENTS
              value: {{ .Values.config.enableBotComments | quote }}
            - name: REMINDER_ENABLED
              value: {{ .Values.config.reminderEnabled | quote }}
            - name: REMINDER_HOURS
              value: {{ .Values.config.reminderHours | quote }}
            - name: REMINDER_WEEKDAYS_ONLY
              value: {{ .Values.config.reminderWeekdaysOnly | quote }}
            - name: REMINDER_DEFAULT_TZ
              value: {{ .Values.config.reminderDefaultTZ | quote }}
            - name: DEPLOY_ENVIRONMENTS
              value: {{ .Values.config.deployEnvironments | toJson | quote }}
            {{- $secretName := default (printf "%s-secrets" .Release.Name) .Values.existingSecret }}
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITHUB_CLIENT_SECRET
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITHUB_WEBHOOK_SECRET
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITHUB_APP_ID
            - name: GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITHUB_PRIVATE_KEY
            - name: GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITHUB_INSTALLATION_ID
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: SLACK_BOT_TOKEN
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: SLACK_SIGNING_SECRET
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              {{- if .Values.otel.serviceName }}
              value: {{ .Values.otel.serviceName | quote }}
              {{- else }}
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/name']
              {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.litestream.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if or .Values.persistence.enabled .Values.litestream.enabled }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.litestream.emptyDirSizeLimit }}
          {{- end }}
        {{- if .Values.litestream.enabled }}
        - name: litestream-config
          configMap:
            name: {{ .Release.Name }}-litestream
        {{- end }}
      {{- end }}
