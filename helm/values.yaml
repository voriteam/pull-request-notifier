replicaCount: 1
nameOverride: ""
containerName: ""
goMemLimit: ""

image:
  repository: ghcr.io/voriteam/pull-request-notifier
  tag: latest
  pullPolicy: IfNotPresent

config:
  baseURL: ""
  port: "8080"
  dbPath: "/data/pr-notifier.db"
  enableBotComments: false
  # Daily reminders for PRs awaiting a user's review.
  reminderEnabled: true
  reminderHours: "9,13,15"
  reminderWeekdaysOnly: true
  reminderDefaultTZ: "America/Los_Angeles"
  # Weekly "who's on duty" announcement posted to a Slack channel.
  # The bot must be invited to the channel (required for private channels).
  rotationEnabled: false
  rotationChannelID: ""
  # Comma-separated SLACK_USER_ID:Name pairs, in rotation order.
  rotationMembers: ""
  # A date (YYYY-MM-DD) in a week where the first member is the owner.
  rotationStartDate: ""
  rotationWeekday: "Monday"
  rotationHour: "9"
  rotationTZ: "America/Los_Angeles"
  rotationMessage: "_This week's owner:_"

# Provide credentials inline (for dev/testing).
secrets:
  githubClientID: ""
  githubClientSecret: ""
  githubWebhookSecret: ""
  githubAppID: ""
  githubPrivateKey: ""
  githubInstallationID: ""
  slackBotToken: ""
  slackSigningSecret: ""

# Or reference a pre-created Kubernetes Secret (for production).
existingSecret: ""

persistence:
  enabled: true
  storageClass: ""
  size: 100Mi
  accessModes:
    - ReadWriteOnce

gateway:
  enabled: false
  hostname: ""
  parentRefs: []
  #   - name: my-gateway
  #     namespace: gateway-system

serviceAccount:
  create: true
  name: ""

otel:
  enabled: false
  endpoint: ""
  serviceName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
