replicaCount: 1
nameOverride: ""
containerName: ""
goMemLimit: ""

image:
  repository: ghcr.io/voriteam/pull-request-notifier
  tag: latest
  pullPolicy: IfNotPresent

config:
  baseURL: ""
  port: "8080"
  dbPath: "/data/pr-notifier.db"
  enableBotComments: false
  # Daily reminders for PRs awaiting a user's review.
  reminderEnabled: true
  reminderHours: "9,13,15"
  reminderWeekdaysOnly: true
  reminderDefaultTZ: "America/Los_Angeles"

# Provide credentials inline (for dev/testing).
secrets:
  githubClientID: ""
  githubClientSecret: ""
  githubWebhookSecret: ""
  githubAppID: ""
  githubPrivateKey: ""
  githubInstallationID: ""
  slackBotToken: ""
  slackSigningSecret: ""

# Or reference a pre-created Kubernetes Secret (for production).
existingSecret: ""

persistence:
  enabled: true
  storageClass: ""
  size: 100Mi
  accessModes:
    - ReadWriteOnce

# Streams the SQLite database to object storage and restores it on start, so
# the pod can run without a persistent disk (persistence.enabled: false).
# Run one replica only: two pods replicating to one URL corrupt the replica.
litestream:
  enabled: false
  image: litestream/litestream:0.5.17
  # e.g. gs://bucket/path or s3://bucket/path
  replicaURL: ""
  # Upper bound on writes lost when the node dies without a clean shutdown.
  syncInterval: 10s
  # Must match the app image's user so both containers can write the WAL.
  runAsUser: 100
  runAsGroup: 100
  emptyDirSizeLimit: 1Gi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

gateway:
  enabled: false
  hostname: ""
  parentRefs: []
  #   - name: my-gateway
  #     namespace: gateway-system

serviceAccount:
  create: true
  name: ""
  # e.g. iam.gke.io/gcp-service-account for Litestream's bucket access on GKE
  annotations: {}

otel:
  enabled: false
  endpoint: ""
  serviceName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
